name: Compilar STEVE Daily v1.17 LAB
on:
  push:
    branches: [v1.17-lab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extraer proyecto
        run: unzip -q STEVE_Daily_v1.17_LAB_FUENTE.zip -d lab
      - name: Compilar APK
        run: gradle -p lab --no-daemon assembleDebug
      - name: Nombrar APK
        run: cp lab/app/build/outputs/apk/debug/app-debug.apk STEVE_Daily_v1.17_LAB_MOTOROLA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: STEVE-Daily-v1.17-LAB-APK
          path: STEVE_Daily_v1.17_LAB_MOTOROLA.apk
