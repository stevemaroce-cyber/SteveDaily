name: Compilar STEVE Daily Lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extraer fuente corregida
        run: unzip -q STEVE_Daily_Lab_v04_Fuente_Android.zip -d lab
      - name: Verificar version esperada
        run: grep -F "versionName '1.17.1-MOTOROLA-LAB'" lab/app/build.gradle
      - name: Compilar y comprobar APK
        run: |
          gradle -p lab --no-daemon assembleDebug
          APK=lab/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > lab/apk-metadata.txt
          grep -F "versionName='1.17.1-MOTOROLA-LAB'" lab/apk-metadata.txt
          sha256sum "$APK" > lab/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: STEVE-Daily-1.17.1-LAB-APK
          if-no-files-found: error
          path: |
            lab/app/build/outputs/apk/debug/app-debug.apk
            lab/apk-metadata.txt
            lab/apk-sha256.txt
