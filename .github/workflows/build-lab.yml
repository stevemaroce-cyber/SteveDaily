name: Compilar STEVE Daily Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extraer proyecto
        run: unzip -q STEVE_Daily_Lab_v03_Fuente_Android.zip -d lab
      - name: Compilar APK
        run: gradle -p lab --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: STEVE-Daily-Lab-APK
          path: lab/app/build/outputs/apk/debug/app-debug.apk
