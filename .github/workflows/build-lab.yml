name: Compilar STEVE Daily v1.17.5 LAB
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar Android 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No se encontro sdkmanager"
            exit 1
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extraer fuente v1.17.5
        run: |
          set -euo pipefail
          unzip -q STEVE_Daily_1_17_5_LISTO_PARA_DESCARGAR.zip -d lab
          test -s lab/app/src/main/java/com/stevedaily/app/MainActivity.kt
          test -s lab/app/src/main/java/com/stevedaily/app/BackupManager.kt
          grep -F "versionName '1.17.5-MOTOROLA-LAB'" lab/app/build.gradle
          grep -F "applicationId 'com.stevedaily.motorola.lab.v1175'" lab/app/build.gradle
      - name: Corregir error Kotlin de To Buy
        shell: bash
        run: |
          set -euo pipefail
          FILE=lab/app/src/main/java/com/stevedaily/app/MainActivity.kt
          grep -F 'o.put("bought", false).remove("boughtAt").remove("purchaseId")' "$FILE"
          sed -i 's@o.put("bought", false).remove("boughtAt").remove("purchaseId")@o.put("bought", false); o.remove("boughtAt"); o.remove("purchaseId")@' "$FILE"
          grep -F 'o.put("bought", false); o.remove("boughtAt"); o.remove("purchaseId")' "$FILE"
      - name: Compilar APK de laboratorio
        run: gradle -p lab --no-daemon assembleDebug --stacktrace
      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail
          APK=lab/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee lab/apk-metadata.txt
          grep -F "name='com.stevedaily.motorola.lab.v1175'" lab/apk-metadata.txt
          grep -F "versionName='1.17.5-MOTOROLA-LAB'" lab/apk-metadata.txt
          sha256sum "$APK" | tee lab/apk-sha256.txt
      - name: Guardar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: STEVE-Daily-v1.17.5-LAB-APK
          if-no-files-found: error
          path: |
            lab/app/build/outputs/apk/debug/app-debug.apk
            lab/apk-metadata.txt
            lab/apk-sha256.txt
          retention-days: 60
